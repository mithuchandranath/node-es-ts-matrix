name: Refresh matrix data

on:
  schedule:
    # Weekly, Mondays 06:17 UTC (off-peak minute to avoid the :00 stampede)
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-data

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/matrix.json; then
            echo "matrix.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/matrix.json
          git commit -m "data: refresh matrix.json"
          git push
